{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Notsy — a minimal, modern note-taking app">
    <title>{% block title %}Notsy{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% if messages %}
    <div class="toast-container" id="toast-container">
        {% for message in messages %}
        <div class="toast toast-{{ message.tags }}" role="alert">
            <span>{{ message }}</span>
            <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block body %}{% endblock %}

    <script src="{% static 'notes/js/app.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
